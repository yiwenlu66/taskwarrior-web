<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Taskwarrior">
  <title>Taskwarrior</title>
  <style>
    /* Follows the app: ink square on light chrome, paper square on dark chrome. */
    .plate { fill: #0d0d0d }
    .ink { stroke: #f9f9f9 }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #f1f1f1 }
      .ink { stroke: #171717 }
    }
  </style>
  <rect class="plate" width="32" height="32" rx="7"/>
  <g class="ink" fill="none" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.5 9.5 L15.5 16 L9.5 22.5"/>
    <path d="M17.5 22.5 H23"/>
  </g>
</svg>
